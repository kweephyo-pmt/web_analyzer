# TBS_web Analyzer Workflow Add New Feature With Backend And Frontend Integration

## Action

Follow the add-new-feature-with-backend-and-frontend-integration workflow:
1. Create or update backend service(s) to handle new data or logic
2. Update or add backend API route(s) to expose new functionality
3. Modify backend config or requirements if needed
4. Add or update frontend page(s) for the new feature
5. Update frontend components (e.g., summaries, tables, selectors) to display new data
6. Update Sidebar or navigation to link to new feature
7. Update App.jsx to register new routes/pages

## Evidence

- Workflow detected from commit patterns
- Frequency: ~2x per month
- Files: backend/api/routes.py, backend/services/*.py, backend/config.py

